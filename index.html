<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="刘秋靖的个人主页：贵州大学电子信息科学与技术 2026 届本科生，嵌入式开发、硬件设计与学科竞赛经历">
  <title>刘秋靖 · 个人主页</title>
  <style>
/* ============================================================
   base.css — 设计变量、重置、基础排版（Apple 风格深色）
   ============================================================ */

:root {
  /* 色板（深色模式） */
  --bg: #0b0b0f;
  --surface: rgba(28, 28, 30, 0.55);
  --surface-strong: rgba(28, 28, 30, 0.88);
  --separator: rgba(84, 84, 88, 0.35);
  --text-primary: #f5f5f7;
  --text-secondary: #b3b3b9;
  --accent: #0a84ff;
  --accent-2: #5e5ce6;
  --accent-soft: rgba(10, 132, 255, 0.14);
  --green: #30d158;

  /* 形状与尺寸 */
  --radius-card: 18px;
  --radius-btn: 980px;
  --header-h: 52px;
  --maxw: 1440px;

  /* 动效 */
  --ease-out: cubic-bezier(0.32, 0.72, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: var(--bg); scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background: transparent;
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
    "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.6;
  font-size: 15px;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1; /* 内容位于粒子背景之上 */
}

/* 粒子背景层 */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

::selection { background: rgba(10, 132, 255, 0.4); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #2c2c2e; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a3c; }

h1, h2, h3 { font-weight: 700; letter-spacing: 0.2px; }
p { color: var(--text-secondary); }
a { color: var(--accent); }

img { max-width: 100%; display: block; }
/* ============================================================
   layout.css — 导航、主视图、页脚、布局容器
   ============================================================ */

.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 28px;
}

/* ---------- 顶部导航（毛玻璃、固定、紧凑） ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(11, 11, 15, 0.65);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--separator);
}

.header-inner {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: var(--header-h);
  gap: 16px;
}

.logo {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  text-decoration: none;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.nav-links { display: flex; gap: 2px; }

.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  padding: 6px 14px;
  border-radius: var(--radius-btn);
  font-size: 14px;
  transition: color 0.18s, background 0.18s;
}

.nav-links a:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }

.nav-links a.active { color: #fff; background: rgba(255, 255, 255, 0.1); }

.header-actions { display: flex; align-items: center; gap: 8px; }

.lang-toggle {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  border: 1px solid var(--separator);
  border-radius: var(--radius-btn);
  padding: 5px 14px;
  font-size: 12.5px;
  cursor: pointer;
  transition: background 0.18s, filter 0.18s;
}

.lang-toggle:hover { background: rgba(255, 255, 255, 0.14); }

/* 汉堡按钮（移动端） */
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  width: 36px;
  height: 36px;
  background: transparent;
  border: 1px solid var(--separator);
  border-radius: 10px;
  cursor: pointer;
}

.nav-toggle span {
  display: block;
  width: 16px;
  height: 2px;
  margin: 0 auto;
  background: var(--text-primary);
  border-radius: 1px;
  transition: transform 0.25s var(--ease-out), opacity 0.25s;
}

.nav-toggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; }
.nav-toggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ---------- 主视图 ---------- */
.main-view {
  flex: 1;
  padding-top: 12px;
  padding-bottom: 48px;
}

/* 视图切换动画 */
.view-enter {
  animation: viewIn 0.3s var(--ease-out) both;
}

/* 首屏加载占位（词典加载完成前显示） */
.boot-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 90px 0;
  color: var(--text-secondary);
  font-size: 14px;
}

.boot-spinner {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.12);
  border-top-color: var(--accent);
  animation: bootSpin 0.8s linear infinite;
}

@keyframes bootSpin {
  to { transform: rotate(360deg); }
}

@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ---------- 页脚 ---------- */
.site-footer {
  border-top: 1px solid var(--separator);
  padding: 14px 0 18px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
}

.site-footer p { color: var(--text-secondary); }

/* ---------- 响应式 ---------- */
@media (max-width: 900px) {
  .container { padding: 0 20px; }
}

@media (max-width: 640px) {
  .nav-toggle { display: flex; }

  .nav-links {
    position: absolute;
    top: var(--header-h);
    left: 0;
    right: 0;
    flex-direction: column;
    gap: 4px;
    background: rgba(11, 11, 15, 0.96);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--separator);
    padding: 12px 20px 16px;
    display: none;
  }

  .nav-links.open { display: flex; }
  .nav-links a { padding: 10px 16px; font-size: 16px; }
}
/* ============================================================
   components.css — 通用组件：按钮、卡片、网格、标签等
   ============================================================ */

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 22px;
  border-radius: var(--radius-btn);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform 0.15s var(--ease-out), box-shadow 0.2s var(--ease-out), background 0.2s;
}

.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(0.98); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: 0 4px 18px rgba(10, 132, 255, 0.35);
}

.btn-primary:hover { box-shadow: 0 6px 24px rgba(10, 132, 255, 0.5); }

.btn-ghost {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
  border-color: var(--separator);
}

.btn-ghost:hover { background: rgba(255, 255, 255, 0.12); }

.btn-sm { padding: 7px 16px; font-size: 12.5px; }

.btn.copied { color: var(--green); border-color: rgba(48, 209, 88, 0.6); }

/* ---------- 卡片（毛玻璃） ---------- */
.card {
  background: var(--surface);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid var(--separator);
  border-radius: var(--radius-card);
  padding: 22px;
  transition: transform 0.2s var(--ease-out), border-color 0.2s, background 0.2s;
}

.card:hover {
  transform: translateY(-3px);
  border-color: rgba(120, 120, 128, 0.55);
  background: rgba(32, 32, 35, 0.62);
}

/* ---------- 网格 ---------- */
.grid { display: grid; gap: 16px; align-items: start; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-5 { grid-template-columns: repeat(5, 1fr); gap: 12px; }

.center { text-align: center; margin-top: 24px; }

/* ---------- 统一项目/作品卡片（默认展开、高度与行数统一） ---------- */
.pcard {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  height: 100%;
}

.pcard-title {
  font-size: 14.5px;
  line-height: 1.4;
  min-height: 2.8em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pcard-desc {
  font-size: 12.5px;
  color: var(--text-secondary);
  min-height: 3.2em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pcard-field { display: flex; flex-direction: column; gap: 2px; }

.pcard-label {
  font-size: 11px;
  font-weight: 700;
  color: #64b5ff;
  letter-spacing: 0.5px;
}

.pcard-field p {
  font-size: 12.5px;
  min-height: 3em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pcard .arch-box { font-size: 11.5px; padding: 10px 12px; line-height: 1.55; }

.pcard .portfolio-cover { height: 72px; font-size: 14px; letter-spacing: 2px; }

.pcard .portfolio-type { margin: 0; }

.pcard .tags { min-height: 24px; }

/* ---------- 分页 ---------- */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-top: 22px;
}

.page-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--separator);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.page-btn:hover:not([disabled]) { background: rgba(255, 255, 255, 0.12); border-color: var(--border-strong); }

.page-btn[disabled] { opacity: 0.35; cursor: default; }

.page-info { font-size: 13px; color: var(--text-secondary); }

/* ---------- 区块标题 ---------- */
.section { margin-top: 36px; }
.section:first-of-type { margin-top: 0; }

.section-head { margin-bottom: 12px; }

.section-title {
  font-size: 21px;
  font-weight: 700;
  color: var(--text-primary);
}

.section-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 3px;
}

/* ---------- 标签 ---------- */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

.tag {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: var(--radius-btn);
  background: var(--accent-soft);
  color: #64b5ff;
  border: 1px solid rgba(10, 132, 255, 0.25);
}

/* ---------- 标签芯片（兴趣） ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  padding: 8px 18px;
  border-radius: var(--radius-btn);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--separator);
  color: var(--text-primary);
  font-size: 14px;
}

/* ---------- 状态点 ---------- */
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  display: inline-block;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ---------- 项目卡片（含展开详情） ---------- */
.project-card { display: flex; flex-direction: column; gap: 8px; }

.project-card h3 { font-size: 16.5px; }

.project-card p { font-size: 14px; flex: 1; }

.project-link {
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}

.project-link:hover { text-decoration: underline; }

/* 架构图代码块 */
.arch-box {
  font-family: Consolas, "Courier New", "Microsoft YaHei", monospace;
  font-size: 13px;
  line-height: 1.6;
  color: #a8cdf8;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid var(--separator);
  border-radius: 12px;
  padding: 14px 16px;
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0;
}

/* ---------- 技能 ---------- */
.skill-cat-title {
  font-size: 19px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px 28px;
}

.skill-item {
  display: grid;
  grid-template-columns: 150px 1fr 34px;
  align-items: center;
  gap: 12px;
  min-height: 30px;
}

.skill-name {
  font-size: 15px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.skill-bar {
  height: 7px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
}

.skill-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 4px;
  transition: width 0.6s var(--ease-out);
}

.skill-level { font-size: 12.5px; color: var(--text-secondary); text-align: right; }

/* ---------- 时间线 ---------- */
.timeline { position: relative; margin-top: 6px; }

.timeline::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: var(--separator);
}

.timeline-item { position: relative; padding: 0 0 22px 32px; }
.timeline-item:last-child { padding-bottom: 0; }

.timeline-dot {
  position: absolute;
  left: 0;
  top: 6px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
  box-shadow: 0 0 10px rgba(10, 132, 255, 0.5);
}

.timeline-time { font-size: 12.5px; color: var(--accent); font-weight: 600; }

.timeline-content h3 { font-size: 16px; margin: 2px 0 3px; }

.timeline-content p { font-size: 14px; }

/* ---------- 个人特质卡（全宽一行、四卡等高） ---------- */
.traits-grid { align-items: stretch; }

.trait-card {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 20px 16px;
}

.trait-icon { font-size: 28px; margin-bottom: 8px; }

.trait-card h3 { font-size: 15.5px; margin-bottom: 4px; }

.trait-card p {
  flex: 1;
  font-size: 13.5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.7em;
}

/* ---------- 荣誉与奖项 ---------- */
.honor-card { padding: 14px; display: flex; flex-direction: column; }

.honor-thumb {
  height: 130px;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #16324a, #1c2a5e);
  flex-shrink: 0;
}

.honor-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.25s var(--ease-out);
}

.honor-thumb:hover img { transform: scale(1.04); }

.honor-thumb .honor-emoji { font-size: 30px; }

.honor-card h3 { font-size: 14px; margin: 10px 0 6px; flex: 1; }

.honor-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
}

.honor-level {
  font-size: 11px;
  padding: 1px 9px;
  border-radius: var(--radius-btn);
  background: var(--accent-soft);
  color: #64b5ff;
  border: 1px solid rgba(10, 132, 255, 0.25);
}

/* ---------- 作品卡片 ---------- */
.portfolio-card {
  display: flex;
  flex-direction: column;
  text-decoration: none;
  padding: 0;
  overflow: hidden;
  color: var(--text-primary);
}

.portfolio-cover {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 3px;
  background: linear-gradient(135deg, #16324a, #1c2a5e);
}

.cover-num {
  font-size: 30px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.55);
  letter-spacing: 2px;
}

.portfolio-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.portfolio-card:nth-child(2) .portfolio-cover { background: linear-gradient(135deg, #1c2a5e, #2a1c5e); }
.portfolio-card:nth-child(3) .portfolio-cover { background: linear-gradient(135deg, #2a4a1c, #1c5e50); }
.portfolio-card:nth-child(4) .portfolio-cover { background: linear-gradient(135deg, #4a2a3a, #5e3a1c); }

.portfolio-card h3 { margin: 16px 18px 0; font-size: 15.5px; }

.portfolio-card p { margin: 5px 18px 0; font-size: 13.5px; }

.portfolio-type {
  margin: 10px 18px 0;
  align-self: flex-start;
  font-size: 11.5px;
  color: #64b5ff;
  border: 1px solid rgba(10, 132, 255, 0.3);
  padding: 2px 10px;
  border-radius: var(--radius-btn);
  background: var(--accent-soft);
}

/* ---------- 响应式 ---------- */
@media (max-width: 1200px) {
  .grid-5 { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 900px) {
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .skill-grid { grid-template-columns: 1fr; }
}

@media (max-width: 640px) {
  .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
  .skill-item { grid-template-columns: 118px 1fr 30px; }
}
/* ============================================================
   views.css — 各视图专属样式
   ============================================================ */

/* ---------- 首页：左右结构（个人信息 | 当前状态），一屏展示 ---------- */
.hero-split {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 44px;
  align-items: center;
  padding: 8px 0 8px;
}

.hero-left { text-align: left; }

.hero-identity {
  display: flex;
  align-items: center;
  gap: 18px;
}

.hero-avatar {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 2px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 8px 32px rgba(10, 132, 255, 0.28);
  flex-shrink: 0;
}

.hero-greeting { font-size: 15px; color: var(--text-secondary); }

.hero-name {
  font-size: 40px;
  line-height: 1.1;
  margin: 2px 0 2px;
  letter-spacing: 1px;
  background: linear-gradient(120deg, #fff, #b8d8ff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.hero-tagline {
  font-size: 16.5px;
  color: var(--accent);
  font-weight: 600;
}

.hero-intro {
  margin: 8px 0 8px;
  font-size: 14px;
  max-width: 560px;
}

.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--separator);
  border-radius: var(--radius-btn);
  padding: 6px 15px;
  color: var(--text-primary);
  font-size: 13px;
}

.hero-actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  flex-wrap: wrap;
}

/* 首页左下角联系方式 */
.hero-contact {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--text-secondary);
}

.hero-contact-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: inherit;
  transition: color 0.2s;
}

.hero-contact-item:hover { color: var(--accent); }

/* 右侧：状态竖排小卡 */
.status-stack { display: flex; flex-direction: column; gap: 8px; }

.status-card-row {
  display: flex;

/* ===== I18n.js ===== */
/**
 * I18n.js — 中英双语词典（ES Module）
 * 词典由 Modules/Dicts.js 提供（Launcher/Build.py 从 Languages/*.json 打包），
 * 随模块图并行加载、零网络等待，首屏渲染更快。
 * [data-i18n] / [data-i18n-attr] 静态替换；视图渲染由 Router 触发。
 */

const SUPPORTED = ['zh', 'en'];
const DEFAULT = 'zh';
const dicts = DICTS;
const langListeners = [];

function pickLang() {
  try {
    const stored = localStorage.getItem('site-lang');
    if (SUPPORTED.includes(stored)) return stored;
  } catch (e) { /* ignore */ }
  return DEFAULT;
}

let i18nCurrent = pickLang();

function currentLang() {
  return i18nCurrent;
}

/** 按 key.path 取当前语言文案 */
function t(key) {
  const d = dicts[i18nCurrent] || {};
  const val = key.split('.').reduce((o, k) => (o == null ? undefined : o[k]), d);
  return val === undefined || val === null ? key : val;
}

/** HTML 转义 */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/** 应用文档中所有静态 [data-i18n] / [data-i18n-attr] */
function applyStatic() {
  document.documentElement.lang = i18nCurrent === 'zh' ? 'zh-CN' : 'en';
  const year = String(new Date().getFullYear());
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    let text = t(el.getAttribute('data-i18n'));
    // {year} 占位符统一替换（视图重渲染后也会被调用，保证不出现字面量）
    if (typeof text === 'string') text = text.split('{year}').join(year);
    el.textContent = text;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
    const spec = el.getAttribute('data-i18n-attr').split(':');
    if (spec.length === 2) el.setAttribute(spec[0], t(spec[1]));
  });
}

function onLangChange(fn) {
  langListeners.push(fn);
}

async function setLang(lang) {
  if (!SUPPORTED.includes(lang)) return;
  i18nCurrent = lang;
  try { localStorage.setItem('site-lang', lang); } catch (e) { /* ignore */ }
  applyStatic();
  updateToggle();
  langListeners.forEach((fn) => fn());
}

function updateToggle() {
  document.querySelectorAll('[data-lang-toggle]').forEach((btn) => {
    btn.textContent = i18nCurrent === 'zh' ? 'EN' : '中文';
    btn.title = i18nCurrent === 'zh' ? 'Switch to English' : '切换到中文';
  });
}

// 全局导出（视图 mount 钩子等处使用）
window.i18n = {
  t,
  esc,
  setLang,
  get i18nCurrent() { return i18nCurrent; }
};

/** 初始化：词典已随模块加载，直接应用并绑定语言按钮 */
async function initI18n() {
  applyStatic();
  updateToggle();
  document.querySelectorAll('[data-lang-toggle]').forEach((btn) => {
    btn.addEventListener('click', () => setLang(i18nCurrent === 'zh' ? 'en' : 'zh'));
  });
}

/* ===== Background.js ===== */
/**
 * background.js — 交互式粒子背景（ES Module，性能优化版）
 * 性能要点：
 * - 空间哈希网格分桶：连线与斥力只检查相邻桶，O(n·k) 替代 O(n²)
 * - 颜色预生成分档，避免每帧字符串拼接
 * - 粒子数按面积自适应且封顶；帧率过低自动降级
 * - 泊松盘采样初始化 + 粒子间弱斥力，聚集后快速恢复均匀
 */
function initBackground() {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let w = 0, h = 0, dpr = 1;
  const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999 };
  let particles = [];

  const LINK_DIST = 95;    // 连线最大距离
  const RADIUS = 170;      // 吸引半径
  const HALO = 42;         // 光标光环半径
  const PULL = 0.75;       // 吸引强度
  const PUSH = 0.3;        // 光环内轻微外推
  const REPEL = 30;        // 粒子间斥力距离
  const REPEL_FORCE = 0.02;
  const MIN_SPACING = 15;  // 泊松盘最小间距
  const CELL = 90;         // 空间网格边长

  const DOT = 'rgba(130, 190, 255, 0.42)';
  // 连线颜色按距离预分 5 档，避免每帧拼字符串
  const LINK_LEVELS = [0.018, 0.036, 0.054, 0.072, 0.085]
    .map((a) => 'rgba(130, 190, 255, ' + a.toFixed(3) + ')');

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 空间哈希桶
  const cells = new Map();
  let idCounter = 0;

  function cellKey(x, y) {
    return Math.floor(x / CELL) + ',' + Math.floor(y / CELL);
  }

  function buildGrid() {
    cells.clear();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const key = cellKey(p.x, p.y);
      let arr = cells.get(key);
      if (!arr) { arr = []; cells.set(key, arr); }
      arr.push(p);
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function targetCount() {
    const count = Math.round((w * h) / 11000);
    return Math.max(50, Math.min(240, count));
  }

  /** 泊松盘采样初始化 */
  function spawn(n) {
    for (let i = 0; i < n; i++) {
      let x = 0, y = 0, ok = false;
      for (let attempt = 0; attempt < 22 && !ok; attempt++) {
        x = Math.random() * w;
        y = Math.random() * h;
        ok = true;
        for (let j = 0; j < particles.length; j++) {
          const dx = particles[j].x - x;
          const dy = particles[j].y - y;
          if (dx * dx + dy * dy < MIN_SPACING * MIN_SPACING) { ok = false; break; }
        }
      }
      particles.push({
        id: idCounter++,
        x, y,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: 0.7 + Math.random() * 1.1
      });
    }
  }

  function physics(p) {
    if (!reduced) {
      const dx = pointer.x - p.x;
      const dy = pointer.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < RADIUS && dist > 0.01) {
        const nx = dx / dist, ny = dy / dist;
        const force = dist > HALO
          ? (1 - dist / RADIUS) * PULL
          : (dist / HALO - 1) * PUSH;
        p.vx += nx * force;
        p.vy += ny * force;
      }
    }

    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const max = 6;
    if (speed > max) { p.vx = (p.vx / speed) * max; p.vy = (p.vy / speed) * max; }

    p.vx *= 0.985;
    p.vy *= 0.985;
    p.vx += (Math.random() - 0.5) * 0.05;
    p.vy += (Math.random() - 0.5) * 0.05;

    p.x += p.vx;
    p.y += p.vy;

    if (p.x < -20) p.x = w + 20; else if (p.x > w + 20) p.x = -20;
    if (p.y < -20) p.y = h + 20; else if (p.y > h + 20) p.y = -20;
  }

  function draw(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = DOT;
    ctx.fill();
  }

  /** 连线 + 斥力：只检查相邻桶，且每对只处理一次（q.id > p.id） */
  function linksAndRepel(p) {
    const cx = Math.floor(p.x / CELL);
    const cy = Math.floor(p.y / CELL);
    ctx.lineWidth = 0.6;
    for (let gx = cx - 1; gx <= cx + 1; gx++) {
      for (let gy = cy - 1; gy <= cy + 1; gy++) {
        const arr = cells.get(gx + ',' + gy);
        if (!arr) continue;
        for (let k = 0; k < arr.length; k++) {
          const q = arr[k];
          if (q.id <= p.id) continue; // 去重
          const dx = p.x - q.x, dy = p.y - q.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < LINK_DIST * LINK_DIST) {
            const d = Math.sqrt(d2);
            const lv = Math.min(4, Math.floor(d / (LINK_DIST / 5)));
            ctx.strokeStyle = LINK_LEVELS[lv];
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
          if (d2 < REPEL * REPEL && d2 > 0.0001) {
            const d = Math.sqrt(d2);
            const f = (1 - d / REPEL) * REPEL_FORCE;
            const fx = (dx / d) * f, fy = (dy / d) * f;
            p.vx += fx; p.vy += fy;
            q.vx -= fx; q.vy -= fy;
          }
        }
      }
    }
  }

  // 帧率自适应
  const frameTimes = [];

  function frame() {
    requestAnimationFrame(frame);
    const t0 = performance.now();

    pointer.x += (pointer.tx - pointer.x) * 0.14;
    pointer.y += (pointer.ty - pointer.y) * 0.14;

    ctx.clearRect(0, 0, w, h);
    buildGrid();
    for (let i = 0; i < particles.length; i++) {
      linksAndRepel(particles[i]);
    }
    for (let i = 0; i < particles.length; i++) {
      physics(particles[i]);
      draw(particles[i]);
    }

    frameTimes.push(performance.now() - t0);
    if (frameTimes.length > 90) frameTimes.shift();
    if (frameTimes.length === 90) {
      const avg = frameTimes.reduce((a, b) => a + b, 0) / 90;
      frameTimes.length = 0;
      if (avg > 20 && particles.length > 60) {
        particles = particles.slice(0, Math.floor(particles.length * 0.6));
      } else if (avg < 9 && particles.length < targetCount()) {
        spawn(Math.min(20, targetCount() - particles.length));
      }
    }
  }

  function adjustCount() {
    const want = targetCount();
    while (particles.length > want) particles.pop();
    while (particles.length < want) spawn(want - particles.length);
  }

  window.addEventListener('pointermove', (e) => {
    pointer.tx = e.clientX;
    pointer.ty = e.clientY;
  });
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      pointer.tx = e.touches[0].clientX;
      pointer.ty = e.touches[0].clientY;
    }
  }, { passive: true });
  document.addEventListener('mouseleave', () => {
    pointer.x = pointer.tx = -9999;
    pointer.y = pointer.ty = -9999;
  });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      adjustCount();
    }, 200);
  });

  resize();
  spawn(targetCount());

  if (reduced) {
    buildGrid();
    particles.forEach((p) => { linksAndRepel(p); draw(p); });
  } else {
    frame();
  }
}

/* ===== Router.js ===== */
/**
 * router.js — Hash 路由：视图切换 + 过渡动画 + 导航高亮
 * - URL 形如 #/home、#/about …，默认 #/home
 * - 切换时重渲染 #view 并播放淡入动画（粒子背景不受影响）
 */

let routerCurrent = null;

function currentViewName() {
  return routerCurrent;
}

/** 解析当前 hash 对应的视图名（非法值回退 home） */
function parseHash() {
  const name = location.hash.replace(/^#\/?/, '') || 'home';
  return views[name] ? name : 'home';
}

/** 渲染指定视图 */
function renderView(name) {
  const view = views[name];
  if (!view) return;
  routerCurrent = name;

  const main = document.getElementById('view');
  main.innerHTML = view.render(t);
  // 重启动画
  main.classList.remove('view-enter');
  void main.offsetWidth;
  main.classList.add('view-enter');

  applyStatic(); // 视图内静态 [data-i18n]（如页脚年份等全局元素）
  document.title = t(`meta.${name}Title`);

  // 导航高亮
  document.querySelectorAll('.nav-links a[data-nav]').forEach((a) => {
    a.classList.toggle('active', a.getAttribute('data-nav') === name);
  });

  if (view.mount) view.mount();
}

/** 初始化路由并渲染当前 hash */
function initRouter() {
  window.addEventListener('hashchange', () => renderView(parseHash()));

  // 点击同一视图链接时不触发 hashchange，需手动刷新
  document.querySelectorAll('.nav-links a[data-nav]').forEach((a) => {
    a.addEventListener('click', () => {
      if (a.getAttribute('data-nav') === parseHash()) renderView(parseHash());
    });
  });

  renderView(parseHash());
}

/**
 * views/skills.js — 技能

/** 根据一组技能生成雷达图 SVG（轴数随技能数量 4~8 自适应） */
function radarSVG(items) {
  const n = items.length;
  const cx = 210, cy = 205, R = 132;
  const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const pt = (i, r) => [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))];

  let grid = '', axes = '', labels = '';
  const data = [];

  [0.25, 0.5, 0.75, 1].forEach((lv) => {
    const pts = [];
    for (let i = 0; i < n; i++) pts.push(pt(i, R * lv).map((v) => v.toFixed(1)).join(','));
    grid += `<polygon points="${pts.join(' ')}" class="radar-grid"/>`;
  });

  items.forEach((it, i) => {
    const p = pt(i, R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" class="radar-axis"/>`;
    data.push(pt(i, R * ((it.level || 0) / 100)).map((v) => v.toFixed(1)).join(','));
    const lp = pt(i, R + 32);
    labels += `<text x="${lp[0].toFixed(1)}" y="${lp[1].toFixed(1)}" class="radar-label">${esc(it.name)} · ${it.level}</text>`;
  });

  return `<svg viewBox="0 0 420 410" role="img" aria-label="radar chart">`
    + grid + axes
    + `<polygon points="${data.join(' ')}" class="radar-area"/>`
    + `<polygon points="${data.join(' ')}" class="radar-line"/>`
    + labels
    + `</svg>`;
}

          <div class="radar-wrap" data-radar-wrap>${radarSVG(first.items || [])}</div>
          <div class="radar-legend" data-radar-legend>
            ${(first.items || []).map((x) => `<span class="chip legend-chip">${esc(x.name)} · ${x.level}</span>`).join('')}
          </div>
        </div>
      </section>

    if (!tabs.length || !wrap) return;

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((b) => b.classList.remove('active'));
        tab.classList.add('active');
        const cat = cats[Number(tab.dataset.catIndex)];
        if (!cat) return;
        if (title) title.textContent = cat.name;
        wrap.innerHTML = radarSVG(cat.items || []);
        if (legend) {
          legend.innerHTML = (cat.items || [])
            .map((x) => `<span class="chip legend-chip">${esc(x.name)} · ${x.level}</span>`)
            .join('');
        }
      });
    });
  }

/**
 * views/projects.js — 项目：真分页（每页 5 个）+ 默认展开详情，卡片内容统一
 */

const PAGE_SIZE = 5;
let currentPage = 0;

function cardHTML(p, t) {
  const roleLabel = t('projects.roleLabel');
  const resultLabel = t('projects.resultLabel');
  return `
    <article class="card pcard">
      <h3 class="pcard-title">${esc(p.name)}</h3>
      <div class="tags">${(p.tech || []).map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      <p class="pcard-desc">${esc(p.desc)}</p>
      <div class="pcard-field">
        <span class="pcard-label">${esc(roleLabel)}</span>
        <p>${esc(p.role || '')}</p>
      </div>
      <div class="pcard-field">
        <span class="pcard-label">${esc(resultLabel)}</span>
        <p>${esc(p.result || '')}</p>
      </div>
      <pre class="arch-box">${esc(p.arch || '')}</pre>
    </article>`;
}

function pagerHTML(total, t) {
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (pages <= 1) return '';
  const prev = currentPage > 0 ? '' : ' disabled';
  const next = currentPage < pages - 1 ? '' : ' disabled';
  return `
    <button type="button" class="page-btn" data-page-prev${prev}>‹</button>
    <span class="page-info">${currentPage + 1} / ${pages}</span>
    <button type="button" class="page-btn" data-page-next${next}>›</button>`;
}

const ProjectsView = {
  render(t) {
    currentPage = 0;
    const all = t('projects.list');
    const page = all.slice(0, PAGE_SIZE);
    return `
      <section class="page-head">
        <h1 class="page-title">${esc(t('projects.title'))}</h1>
        <p class="page-subtitle">${esc(t('projects.subtitle'))}</p>
      </section>

      <section class="section">
        <div class="grid grid-5" data-project-grid>
          ${page.map((p) => cardHTML(p, t)).join('')}
        </div>
        <div class="pagination" data-pagination>${pagerHTML(all.length, t)}</div>
      </section>`;
  },

  mount() {
    const grid = document.querySelector('#view [data-project-grid]');
    const pager = document.querySelector('#view [data-pagination]');
    if (!grid || !pager) return;

    const renderPage = () => {
      const all = t('projects.list');
      const start = currentPage * PAGE_SIZE;
      grid.innerHTML = all.slice(start, start + PAGE_SIZE).map((p) => cardHTML(p, t)).join('');
      pager.innerHTML = pagerHTML(all.length, t);
    };

    pager.addEventListener('click', (e) => {
      const all = t('projects.list');
      const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      if (e.target.closest('[data-page-prev]') && currentPage > 0) {
        currentPage--;
        renderPage();
      } else if (e.target.closest('[data-page-next]') && currentPage < pages - 1) {
        currentPage++;
        renderPage();
      }
    });
  }
};

/** 移动端汉堡菜单 */
function initNav() {
  const toggle = document.getElementById('nav-toggle');
  const links = document.getElementById('nav-links');
  if (!toggle || !links) return;
  toggle.addEventListener('click', () => {
    links.classList.toggle('open');
    toggle.classList.toggle('open');
  });
  links.addEventListener('click', (e) => {
    if (e.target.closest && e.target.closest('a')) {
      links.classList.remove('open');
      toggle.classList.remove('open');
    }
  });
}

async function boot() {
  initBackground();          // 粒子常驻，最先启动
  initNav();
  await initI18n();          // 加载词典、绑定语言按钮（{year} 在 applyStatic 内统一替换）
  initRouter();              // 渲染当前视图

  // 切换语言后重渲染当前视图
  onLangChange(() => {
    renderView(currentViewName());
  });
}

boot();
